[package]
name = "depotpro-sync-adapter"
version = "0.1.0"
edition = "2021"
description = "Adaptateur Axum /api/v1 pour la synchronisation DEPOTPRO Mobile. Délègue toutes les règles métier au noyau Rust partagé."

[dependencies]
async-trait = "0.1"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
