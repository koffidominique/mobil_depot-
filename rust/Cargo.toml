[package]
name = "depotpro-mobile-core"
version = "1.0.0"
edition = "2021"
license = "Proprietary"
description = "Moteur métier Rust offline-first de DEPOTPRO MOBILE PREMIUM (Android/iOS)"

[lib]
name = "depotpro_mobile_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
